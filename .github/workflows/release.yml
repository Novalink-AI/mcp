name: Release

# bump the version in package.json, src/constants.ts and .claude-plugin/*.json, then push a tag such as v0.1.2
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # no dependency cache in the job that publishes, so a poisoned cache cannot reach a release
          package-manager-cache: false
      - name: Tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm install -g npm@11.20.0 # pinned: this job can publish; trusted publishing needs 11.5 or newer
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          # empty when trusted publishing is set up on npmjs.com; then OIDC is used instead
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
